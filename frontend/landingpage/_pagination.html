{% if page_obj.has_other_pages %}
<nav class="pagination-bar" aria-label="Pagination">
{% if page_obj.has_previous %}<a class="btn btn-outline-navy" href="?{{ query_string }}&amp;page={{ page_obj.previous_page_number }}">&#8592; Previous</a>{% endif %}<span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a class="btn btn-outline-navy" href="?{{ query_string }}&amp;page={{ page_obj.next_page_number }}">Next &#8594;</a>{% endif %}
</nav>
{% endif %}
