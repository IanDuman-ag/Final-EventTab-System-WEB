{% firstof event.name event.event_name as icon_name %} {% with name=icon_name|lower category=event.category|lower %}
<svg
  viewBox="0 0 64 64"
  fill="none"
  stroke="currentColor"
  stroke-width="2.5"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
>
  {% if 'pageant' in name %}
  <path d="m10 19 10 9 12-17 12 17 10-9-6 27H16L10 19ZM17 53h30" />
  {% elif 'duet' in name %}
  <path d="M27 43V16l24-5v27M27 23l24-5" />
  <ellipse cx="19" cy="45" rx="8" ry="6" />
  <ellipse cx="43" cy="40" rx="8" ry="6" />
  {% elif 'table tennis' in name or 'ping pong' in name %}
  <path d="m25 39-13 15 5 4 14-14" />
  <ellipse cx="36" cy="27" rx="17" ry="21" transform="rotate(35 36 27)" />
  <circle cx="51" cy="50" r="5" />
  {% elif 'dance' in name or 'dancing' in name %}
  <circle cx="33" cy="11" r="5" />
  <path
    d="m30 20-8 10-12-2M30 20l12 8 12-9M30 20l4 16-14 18M34 36l12 18M22 30l18 2"
  />
  {% elif 'basketball' in name or 'volleyball' in name or 'football' in name %}
  <circle cx="32" cy="32" r="22" />
  <path d="M10 32h44M32 10v44M17 16c20 8 20 24 0 32M47 16c-20 8-20 24 0 32" />
  {% elif 'sing' in name or 'music' in name or 'vocal' in name %}
  <rect x="24" y="9" width="16" height="30" rx="8" />
  <path d="M17 30v2c0 9 6 15 15 15s15-6 15-15v-2M32 47v8M22 55h20" />
  {% elif 'dance' in name or 'pageant' in name or 'talent' in name or event.type == 'criteria' %}
  <path d="m32 9 7 15 17 2-12 12 3 17-15-8-15 8 3-17L8 26l17-2 7-15Z" />
  {% elif 'badminton' in name %}
  <ellipse cx="36" cy="23" rx="13" ry="17" transform="rotate(35 36 23)" />
  <path d="m25 36-13 18M29 12l12 22M26 20l16 9M31 37l10-26" />
  {% elif 'chess' in name %}
  <path
    d="M19 53h28M22 47h22l-2-10 3-11-8-15h-9l-8 16 12 3-7 8-3 9ZM28 11l1-5M35 22h1"
  />
  {% else %}
  <path
    d="M20 12h24v14c0 10-5 16-12 16s-12-6-12-16V12ZM20 17H10v6c0 9 6 13 13 13M44 17h10v6c0 9-6 13-13 13M32 42v10M22 54h20"
  />
  {% endif %}
</svg>
{% endwith %}
