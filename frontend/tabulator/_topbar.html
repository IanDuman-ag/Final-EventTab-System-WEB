<header class="et-topbar">
  <div class="et-topbar-left"><button type="button" class="et-menu-btn" id="etMenuBtn" aria-label="Open navigation" aria-controls="etSidebar" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg></button><div class="et-breadcrumb"><span>Tabulator Portal</span><span aria-hidden="true">/</span><strong>{{ topbar_title|default:'Dashboard' }}</strong></div></div>
  <div class="et-topbar-right">{% if event %}<span class="et-status-pill status-{{ event.status_key|default:'upcoming' }}">{{ event.status_label|default:event.status }}</span>{% endif %}<span class="et-user-chip"><span class="avatar">{{ user_initials|default:'T' }}</span><span><strong>{{ user_display|default:'Tabulator' }}</strong><small>Tabulator</small></span></span></div>
</header>
