<section class="et-card event-intro">
  <div class="event-intro-copy"><div class="eyebrow">{{ intro_eyebrow|default:'SELECTED EVENT' }}</div><div class="event-intro-title"><h2>{{ event.name }}</h2><span class="et-status-pill status-{{ event.status_key }}">{{ event.status_label }}</span></div><p>{{ event.category }} · {{ event.event_type }} · {{ event.mode_label }}</p><div class="event-card-meta"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2v3h10V2h2v3h2v17H3V5h2V2zm12 9H5v9h14V7H5z"/></svg>{{ event.date }}</span><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 1 7 7c0 5-7 13-7 13S5 14 5 9a7 7 0 0 1 7-7zm0 4a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>{{ event.venue }}</span></div></div>
  {% if show_event_actions %}<div class="event-intro-actions"><a class="et-btn et-btn-primary" href="{% url 'tabulator_full_results' %}?event_id={{ event.id }}">View Full Results</a><a class="et-btn et-btn-ghost" href="{% url 'tabulator_live_rankings' %}?event_id={{ event.id }}">Live Rankings</a></div>{% endif %}
</section>
